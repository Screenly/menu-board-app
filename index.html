<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dynamic menu board for digital signage" />
    <meta name="theme-color" content="#000000" />
    <title>Dynamic Menu Board</title>
    <script src="screenly.js?version=1"></script>
  </head>
  <body>
    <img id="background" class="backdrop" alt="" />
    <auto-scaler
      reference-width="1920"
      reference-height="1080"
      orientation="auto"
      padding="0"
    >
      <main class="menu" id="menu">
        <h1 class="menu-title" id="title">Today's Menu</h1>
        <ul class="menu-list" id="menuList"></ul>
        <div class="menu-error">
          <h2>Unable to load menu</h2>
          <p>Please check your connection and try again.</p>
        </div>
        <img class="menu-logo" id="logo" alt="Restaurant logo" />
      </main>
    </auto-scaler>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
